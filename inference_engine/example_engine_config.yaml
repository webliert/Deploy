# 推理引擎配置示例
# 此文件展示如何配置不同的推理引擎

# ============================================================
# ONNX Runtime 配置示例
# ============================================================
# engine:
#   type: "onnx"                    # 引擎类型: onnx, openvino, pytorch
#   model_path: "model/policy.onnx" # 模型路径
#   intra_op_num_threads: 1         # 算子内部并行线程数
#   inter_op_num_threads: 1         # 算子间并行线程数
#   enable_mem_pattern: false       # 禁用内存模式（固定输入大小）
#   enable_mem_reuse: true          # 启用内存重用
#   graph_optimization_level: "ORT_ENABLE_ALL"  # 图优化级别
#
# model:
#   input_size: 750                 # 输入大小 (observations_size * num_hist)
#   output_size: 20                 # 输出大小 (action_num)
#   dtype: "float32"

# ============================================================
# OpenVINO 配置示例
# ============================================================
# engine:
#   type: "openvino"
#   model_path: "model/policy.xml"  # OpenVINO IR 模型路径
#   device: "CPU"                   # 推理设备: CPU, GPU, NPU
#   cache_dir: "./ov_cache"         # 模型缓存目录（可选，加速首次加载）
#
# model:
#   input_size: 750
#   output_size: 20
#   dtype: "float32"

# ============================================================
# PyTorch 配置示例
# ============================================================
# engine:
#   type: "pytorch"
#   model_path: "model/policy.pt"   # PyTorch 模型路径 (.pt 或 .pth)
#   device: "cpu"                   # 推理设备: cpu, cuda
#   jit_trace: false                # 是否使用 JIT trace 模型
#
# model:
#   input_size: 750
#   output_size: 20
#   dtype: "float32"

# ============================================================
# 实际使用的配置（取消注释以启用）
# ============================================================
engine:
  type: "onnx"
  model_path: "model/new/policy.onnx"
  intra_op_num_threads: 1
  inter_op_num_threads: 1
  enable_mem_pattern: false
  enable_mem_reuse: true

model:
  input_size: 750
  output_size: 20
  dtype: "float32"

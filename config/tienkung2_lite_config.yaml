# ============================================================
# tienkung2_lite 主配置文件
# 配置说明：运行模式、策略文件、IMU、控制方式等
# ============================================================

# -------------------- 机器人配置 --------------------
# 机器人Profile名称，用于加载robot_profiles目录下的对应profile文件
# 加载后将自动获取：电机数量、关节定义、关节增益、限位等参数
robot_profile: "tienkung2_lite"

# -------------------- 运行模式配置 --------------------
# 是否运行在仿真模式
# true: 仿真模式（不发送真实电机命令）
# false: 真机模式
sim: True

# 是否开启调试模式
# true: 输出详细调试信息（IMU延迟、关节限位日志等）
# false: 正常运行模式
debug: false

# -------------------- 控制方式配置 --------------------
# 可选值: keyboard, joystick, xbox
# keyboard: 键盘控制（默认），用于仿真或测试
# joystick: 云卓手柄控制，用于真机遥控
# xbox: Xbox手柄控制
control_tool: keyboard

# -------------------- 控制周期配置 --------------------
# 控制循环周期，单位：秒
# 典型值: 0.01 (100Hz), 0.005 (200Hz)
# 此参数影响控制频率和策略推理频率
dt: 0.01

# -------------------- 键盘控制参数 --------------------
# 适用场景: control_tool=keyboard
# 用于仿真环境下的速度/高度控制
keyboard:
  # 初始高度：机器人站立时的目标高度（单位：米）
  initial_height: 0.90
  # 前进速度偏移：前进命令的固定偏移量（单位：m/s）
  forward_command_offset: 0.0
  # 侧向速度偏移：左右平移命令的固定偏移量（单位：m/s）
  lateral_command_offset: 0.0
  # 旋转速度偏移：转向命令的固定偏移量（单位：rad/s）
  rotation_command_offset: 0.0
  # 高度步进：每次调整高度的变化量（单位：米）
  height_step: 0.05
  # 最大前进速度：前进方向的最大速度限制（单位：m/s）
  max_forward_speed: 1.5
  # 最大侧向速度：左右平移的最大速度限制（单位：m/s）
  max_lateral_speed: 0.5
  # 最大旋转速度：转向的最大角速度限制（单位：rad/s）
  max_rotation_speed: 0.8

# -------------------- Xbox手柄控制参数 --------------------
# 适用场景: control_tool=xbox
# Xbox/手柄控制时的参数配置
xbox:
  # 初始高度
  initial_height: 0.89
  # 前进速度偏移
  forward_command_offset: 0.0
  # 侧向速度偏移
  lateral_command_offset: 0.0
  # 旋转速度偏移
  rotation_command_offset: 0.0
  # 高度步进
  height_step: 0.05

# -------------------- 云卓手柄控制参数 --------------------
# 适用场景: control_tool=joystick
# 云卓手柄/专业遥控器控制时的参数配置
joystick:
  # 初始高度
  initial_height: 0.957
  # 最大高度限制
  max_height: 0.991
  # 最小高度限制
  min_height: 0.791
  # X轴命令偏移：前进/后退命令的固定偏移
  x_command_offset: 0.0
  # Y轴命令偏移：左右平移命令的固定偏移
  y_command_offset: 0.0
  # 偏航命令偏移：转向命令的固定偏移
  yaw_command_offset: 0.0
  # 前进最大速度：向前移动的最大速度（单位：m/s）
  max_x_plus_speed: 0.8
  # 后退最大速度：向后移动的最大速度（单位：m/s）
  max_x_minus_speed: 0.5
  # 侧向最大速度：左右平移的最大速度（单位：m/s）
  max_y_speed: 0.5
  # 偏航最大速度：转向的最大角速度（单位：rad/s）
  max_yaw_speed: 0.8

# -------------------- 策略文件配置 --------------------
# 策略推理相关配置，包含模型路径和推理引擎参数
policy:
  # 策略模型路径：相对于项目根目录的ONNX模型文件路径
  model_path: "policy/walk_amp/model/policy.onnx"

  # 推理引擎配置
  inference_engine: "onnxruntime"
  engine_options:
    # 图优化级别：ORT_ENABLE_ALL=启用所有优化，ORT_ENABLE_BASIC=基础优化，ORT_DISABLE_ALL=禁用优化
    graph_optimization_level: "ORT_ENABLE_ALL"
    # 运算符内部并行线程数：建议设为CPU物理核心数
    intra_op_num_threads: 1
    # 运算符间并行线程数：建议设为1以避免锁竞争
    inter_op_num_threads: 1
    # 启用内存模式：false=禁用内存模式，避免固定大小输入的规划开销
    enable_mem_pattern: false
    # 启用内存复用：true=启用内存重用机制，减少内存分配
    enable_mem_reuse: true

  # 策略控制参数
  # 动作空间大小：策略输出的动作维度数量
  actions_size: 20
  # 动作缩放比例：将策略输出缩放到实际关节角度范围
  # 可为标量（所有关节相同）或数组（每个关节不同）
  action_scale: 0.25
  # 下采样因子：每多少个控制周期执行一次策略推理
  # 1=每个周期都推理，2=每两个周期推理一次
  decimation: 1
  # 预热时间：启动后等待的时间，用于策略预热（单位：秒）
  warm_start_time: 0.3

  # 归一化配置
  normalization:
    # 观测裁剪范围：将观测值限制在[-clip_observations, clip_observations]范围内
    clip_observations: 100.0
    # 动作裁剪范围：将动作值限制在[-clip_actions, clip_actions]范围内
    clip_actions: 100.0
    # 观测缩放因子：将原始观测值缩放后再输入策略网络
    obs_scales:
      # 线速度缩放因子：将机器人线速度除以此值后输入
      lin_vel: 1.0
      # 角速度缩放因子：将机器人角速度除以此值后输入
      ang_vel: 1.0
      # 关节位置缩放因子：将关节位置除以此值后输入
      dof_pos: 1.0
      # 关节速度缩放因子：将关节速度除以此值后输入
      dof_vel: 1.0

  # 观测配置
  observation:
    # 历史帧数：将多少帧的历史观测拼接为长向量输入
    # 用于为策略提供时序信息
    num_hist: 10
    # 单帧观测长度：每帧观测向量的维度
    observations_size: 75

# -------------------- IMU配置 --------------------
# 惯性测量单元（陀螺仪+加速度计）相关配置
imu:
  # Roll角度偏移：补偿IMU安装角度误差（单位：弧度）
  # 正值表示实际Roll比测量值大，负值相反
  xsense_data_roll_offset: 0.0

# -------------------- 机器人接口配置 --------------------
# 机器人接口层（RobotInterface）的运行参数
robot_interface:
  # 是否裁剪动作到关节限位范围内
  # true: 将超出限位的关节位置命令限制在[min, max]范围内
  # false: 不限制关节位置命令
  clip_actions: false
  # 手臂控制状态列表：允许控制手臂的FSM状态
  # 可选值: "ZERO", "STOP", "WALKAMP"
  # 空列表表示允许所有状态控制手臂
  arms_control_status: ["ZERO", "STOP", "WALKAMP", "WALKAMP_OV"]
  # 仅左手臂控制状态列表：只控制左手臂的FSM状态
  left_arm_only_status: []
  # 仅右手臂控制状态列表：只控制右手臂的FSM状态
  right_arm_only_status: []
  # 是否禁用所有关节
  # true: 所有关节力矩设为0，不发送控制命令
  # false: 正常控制
  disable_joints: false

# tienkung3_dex Robot Profile - 29 Motors Configuration
# 机器人基本参数
robot_name: "tienkung3_dex"
motor_num: 29 # 电机数量
floating_base_dof: 6 # 浮动基座自由度

# 关节ID映射模块路径（已统一为Robot.joint_id_map）
# joint_id_map_module: "Robot.joint_id_map"
# 保留robot_name用于从统一配置中查找

# 关节定义（统一命名规范）
joints:
  legs:
    left:
      [l_hip_roll, l_hip_pitch, l_hip_yaw, l_knee, l_ankle_pitch, l_ankle_roll]
    right:
      [r_hip_roll, r_hip_pitch, r_hip_yaw, r_knee, r_ankle_pitch, r_ankle_roll]
  arms:
    left:
      [
        l_shoulder_pitch,
        l_shoulder_roll,
        l_shoulder_yaw,
        l_elbow,
        l_wrist_yaw,
        l_wrist_pitch,
        l_wrist_roll,
      ]
    right:
      [
        r_shoulder_pitch,
        r_shoulder_roll,
        r_shoulder_yaw,
        r_elbow,
        r_wrist_yaw,
        r_wrist_pitch,
        r_wrist_roll,
      ]
  # 腰部
  waist: [waist_yaw, waist_roll, waist_pitch]

# 关节顺序列表（用于数组索引）
joint_order:
  - l_hip_roll # 0
  - l_hip_pitch # 1
  - l_hip_yaw # 2
  - l_knee # 3
  - l_ankle_pitch # 4
  - l_ankle_roll # 5
  - r_hip_roll # 6
  - r_hip_pitch # 7
  - r_hip_yaw # 8
  - r_knee # 9
  - r_ankle_pitch # 10
  - r_ankle_roll # 11
  - waist_yaw # 12
  - waist_roll # 13
  - waist_pitch # 14
  - l_shoulder_pitch # 15
  - l_shoulder_roll # 16
  - l_shoulder_yaw # 17
  - l_elbow # 18
  - l_wrist_yaw # 19
  - l_wrist_pitch # 20
  - l_wrist_roll # 21
  - r_shoulder_pitch # 22
  - r_shoulder_roll # 23
  - r_shoulder_yaw # 24
  - r_elbow # 25
  - r_wrist_yaw # 26
  - r_wrist_pitch # 27
  - r_wrist_roll # 28

# 零位位置
zero_pos:
  l_hip_roll: 0.0
  l_hip_pitch: 0.0
  l_hip_yaw: 0.0
  l_knee: 0.0
  l_ankle_pitch: 0.0
  l_ankle_roll: 0.0
  r_hip_roll: 0.0
  r_hip_pitch: 0.0
  r_hip_yaw: 0.0

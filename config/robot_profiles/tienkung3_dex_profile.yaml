  l_wrist_roll: 0.0
  r_shoulder_pitch: 0.0
  r_shoulder_roll: 0.0
  r_shoulder_yaw: 0.0
  r_elbow: 0.0
  r_wrist_yaw: 0.0
  r_wrist_pitch: 0.0
  r_wrist_roll: 0.0


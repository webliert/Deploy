# Walk AMP OpenVINO Policy Configuration
# 注意：机器人特定参数（kp, kd, zero_pos等）从robot_profile获取

# 策略特有参数
model_path: "new/walk_lite_40700.xml"
dt: 0.01 # 控制周期（如果与robot_profile不同，以策略为准）

# MuJoCo XML 中的关节顺序（与仿真器/硬件一致）
joint_xml:
  - hip_roll_l_joint # 0
  - hip_pitch_l_joint # 1
  - hip_yaw_l_joint # 2
  - knee_pitch_l_joint # 3
  - ankle_pitch_l_joint # 4
  - ankle_roll_l_joint # 5
  - hip_roll_r_joint # 6
  - hip_pitch_r_joint # 7
  - hip_yaw_r_joint # 8
  - knee_pitch_r_joint # 9
  - ankle_pitch_r_joint # 10
  - ankle_roll_r_joint # 11
  - shoulder_pitch_l_joint # 12
  - shoulder_roll_l_joint # 13
  - shoulder_yaw_l_joint # 14
  - elbow_pitch_l_joint # 15
  - shoulder_pitch_r_joint # 16
  - shoulder_roll_r_joint # 17
  - shoulder_yaw_r_joint # 18
  - elbow_pitch_r_joint # 19

# 策略使用的关节顺序（lab 顺序）
joint_lab:
  - hip_roll_l_joint # lab 0
  - hip_roll_r_joint # lab 1
  - shoulder_pitch_l_joint # lab 2
  - shoulder_pitch_r_joint # lab 3
  - hip_pitch_l_joint # lab 4
  - hip_pitch_r_joint # lab 5
  - shoulder_roll_l_joint # lab 6
  - shoulder_roll_r_joint # lab 7
  - hip_yaw_l_joint # lab 8
  - hip_yaw_r_joint # lab 9
  - shoulder_yaw_l_joint # lab 10
  - shoulder_yaw_r_joint # lab 11
  - knee_pitch_l_joint # lab 12
  - knee_pitch_r_joint # lab 13
  - elbow_pitch_l_joint # lab 14
  - elbow_pitch_r_joint # lab 15
  - ankle_pitch_l_joint # lab 16
  - ankle_pitch_r_joint # lab 17
  - ankle_roll_l_joint # lab 18
  - ankle_roll_r_joint # lab 19

# 策略控制参数
control:
  action_scale: 0.25 # 动作缩放比例
  decimation: 1 # 策略下发频率控制

# 观测参数
size:
  num_hist: 10 # 历史观测帧数
  observations_size: 75 # 单帧观测长度

# 归一化参数
normalization:
  clip_scales:
    clip_observations: 100.0
    clip_actions: 100.0

# Walk AMP Policy Configuration
# 注意：机器人特定参数（kp, kd, zero_pos, ct_scale, motor_num等）从robot_profile获取

# ============================================================
# 推理引擎类型选择：onnx / openvino / pytorch
# 修改此值即可切换推理引擎，代码会自动读取对应引擎的配置块
# ============================================================
engine_type: "onnx"

# ============================================================
# 模型通用配置（所有引擎共享）
# ============================================================
model:
  input_size: 372 # 输入大小 (observations_size * num_hist)
  output_size: 12 # 输出大小 (action_num)
  dtype: "float32" # 数据类型

# ============================================================
# ONNX Runtime 配置
# ============================================================
onnx:
  model_path: "onnx/homie.onnx" # ONNX 模型路径
  intra_op_num_threads: 1 # 算子内部并行线程数
  inter_op_num_threads: 1 # 算子间并行线程数
  enable_mem_pattern: false # 禁用内存模式（固定输入大小）
  enable_mem_reuse: true # 启用内存重用
  graph_optimization_level: "ORT_ENABLE_ALL" # 图优化级别

# ============================================================
# OpenVINO 配置
# ============================================================
openvino:
  model_path: "openvino/walk_lite_40700.xml" # OpenVINO IR 模型路径
  device: "CPU" # 推理设备: CPU, GPU, NPU
  cache_dir: "./ov_cache" # 模型缓存目录（可选，加速首次加载）

# ============================================================
# PyTorch 配置
# ============================================================
pytorch:
  model_path: "pytorch/walk_lite_40700.pt" # PyTorch 模型路径 (.pt 或 .pth)
  device: "cpu" # 推理设备: cpu, cuda
  jit_trace: false # 是否使用 JIT trace 模型

# 策略控制参数
control:
  action_scale: 0.25 # 动作缩放比例
  decimation: 1 # 策略下发频率控制

# 观测参数
size:
  num_hist: 6 # 历史观测帧数
  observations_size: 62 # 单帧观测长度

# 归一化参数
normalization:
  clip_scales:
    clip_observations: 100.0
    clip_actions: 100.0
